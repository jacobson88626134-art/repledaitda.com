name: Auto Publish Research Post

on:
  schedule:
    # 매주 월요일, 목요일 UTC 00:15 (한국시간 오전 09:15) 1편 자동 발행
    - cron: '15 0 * * 1,4'  
    # 주 3회(월·수·금)로 바꾸려면 아래 줄을 대신 사용:
    # - cron: '15 0 * * 1,3,5'
  workflow_dispatch:
    inputs:
      post_count:
        description: '한 번에 생성할 글 개수 (권장: 1~2)'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate article via DeepSeek API
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          POST_COUNT: ${{ github.event.inputs.post_count || '1' }}
        run: node scripts/generate-post.mjs

      - name: Verify Astro build before commit
        run: npm run build

      - name: Commit and push new post
        run: |
          git config user.name "repledaitda-bot"
          git config user.email "bot@repledaitda.com"
          git add src/content/posts/ data/keywords.json
          if git diff --cached --quiet; then
            echo "변경된 파일이 없어 커밋을 생략합니다."
          else
            git commit -m "content: auto-publish research article ($(date +'%Y-%m-%d'))"
            git push
          fi